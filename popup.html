<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Bilibili 评论导出</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bilibili-pink: #FB7299;
        --bilibili-pink-dark: #E95C84;
        --bilibili-blue: #00A1D6;
        --bg-dark: #0F0F1E;
        --bg-gradient: linear-gradient(135deg, #0F0F1E 0%, #1A1A2E 50%, #16213E 100%);
        --glass: rgba(255, 255, 255, 0.05);
        --glass-border: rgba(255, 255, 255, 0.1);
        --text-primary: #FFFFFF;
        --text-secondary: rgba(255, 255, 255, 0.7);
        --text-muted: rgba(255, 255, 255, 0.5);
        --success: #52C41A;
        --error: #FF4D4F;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes shimmer {
        0% { background-position: -100% 0; }
        100% { background-position: 200% 0; }
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }

      body {
        width: 360px;
        background: var(--bg-gradient);
        color: var(--text-primary);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
                     "Microsoft YaHei", "Source Han Sans SC", "Noto Sans CJK SC", sans-serif;
        font-size: 14px;
        line-height: 1.6;
        padding: 20px 24px 24px;
        position: relative;
        overflow-x: hidden;
      }

      /* 背景装饰 */
      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 30% 20%, rgba(251, 114, 153, 0.08) 0%, transparent 50%),
                    radial-gradient(circle at 70% 80%, rgba(0, 161, 214, 0.06) 0%, transparent 50%);
        pointer-events: none;
        animation: pulse 8s ease-in-out infinite;
      }

      .container {
        position: relative;
        z-index: 1;
        animation: fadeInUp 0.5s ease-out;
      }

      /* 标题区域 */
      .header {
        text-align: center;
        margin-bottom: 20px;
      }

      .title {
        font-family: 'Noto Serif SC', serif;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 1px;
        background: linear-gradient(135deg, var(--bilibili-pink) 0%, var(--bilibili-blue) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .subtitle {
        font-size: 12px;
        color: var(--text-muted);
        letter-spacing: 0.5px;
      }

      /* 图标按钮 */
      .icon-btn {
        position: absolute;
        top: 0;
        right: 0;
        background: transparent;
        border: none;
        padding: 2px 4px;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.2s ease;
        display: none;
        opacity: 0.4;
        line-height: 1;
      }

      .icon-btn:hover {
        opacity: 0.9;
        transform: scale(1.15);
      }

      .icon-btn:active {
        transform: scale(0.9);
      }

      /* 玻璃态卡片 */
      .card {
        background: var(--glass);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        border-radius: 16px;
        padding: 18px;
        margin-bottom: 16px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        transition: all 0.3s ease;
      }

      .card:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.15);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
      }

      /* 信息行 */
      .info-row {
        display: flex;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

      .info-row:last-child {
        margin-bottom: 0;
        padding-bottom: 0;
        border-bottom: none;
      }

      .info-label {
        font-size: 12px;
        color: var(--text-muted);
        min-width: 70px;
        font-weight: 500;
        letter-spacing: 0.3px;
      }

      .info-value {
        flex: 1;
        font-size: 13px;
        color: var(--text-secondary);
        font-family: ui-monospace, "SF Mono", "Cascadia Code", "Source Code Pro", Menlo, Consolas, monospace;
        word-break: break-all;
      }

      .info-value.bvid {
        color: var(--bilibili-pink);
        font-weight: 600;
      }

      /* 状态显示 */
      .status-text {
        font-size: 13px;
        line-height: 1.5;
        color: var(--text-secondary);
        white-space: pre-wrap;
      }

      .status-text.ok {
        color: var(--success);
      }

      .status-text.err {
        color: var(--error);
      }

      /* 缓存提示 */
      .cache-notice {
        display: none;
        align-items: center;
        gap: 12px;
        padding: 14px;
        background: linear-gradient(135deg, rgba(251, 114, 153, 0.1) 0%, rgba(0, 161, 214, 0.08) 100%);
        border: 1px solid rgba(251, 114, 153, 0.25);
        border-radius: 12px;
        margin-bottom: 16px;
        animation: fadeInUp 0.4s ease-out 0.2s both;
      }

      .cache-notice.visible {
        display: flex;
      }

      .cache-icon {
        font-size: 28px;
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
      }

      .cache-content {
        flex: 1;
      }

      .cache-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--bilibili-pink);
        margin-bottom: 4px;
        letter-spacing: 0.3px;
      }

      .cache-info {
        font-size: 12px;
        color: var(--text-secondary);
        line-height: 1.4;
      }

      /* 按钮样式 */
      .btn {
        width: 100%;
        border: none;
        border-radius: 12px;
        padding: 12px 18px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
        letter-spacing: 0.5px;
        animation: fadeInUp 0.4s ease-out 0.3s both;
      }

      .btn::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        transition: left 0.5s ease;
      }

      .btn:hover::before {
        left: 100%;
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--bilibili-pink) 0%, var(--bilibili-pink-dark) 100%);
        color: white;
        box-shadow: 0 4px 16px rgba(251, 114, 153, 0.3);
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 24px rgba(251, 114, 153, 0.4);
      }

      .btn-primary:active {
        transform: translateY(0);
      }

      .btn-primary:disabled {
        background: rgba(255, 255, 255, 0.1);
        color: var(--text-muted);
        cursor: not-allowed;
        box-shadow: none;
      }

      .btn-primary:disabled:hover {
        transform: none;
      }

      /* 停止按钮 - 优雅的警示设计 */
      .btn-stop {
        background: linear-gradient(135deg, rgba(255, 107, 107, 0.12) 0%, rgba(239, 68, 68, 0.15) 100%);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        color: #ff6b6b;
        border: 1px solid rgba(255, 107, 107, 0.25);
        margin-top: 10px;
        box-shadow: 0 0 20px rgba(255, 107, 107, 0.08),
                    inset 0 1px 0 rgba(255, 255, 255, 0.1);
        animation: fadeInUp 0.4s ease-out 0.35s both;
        position: relative;
        overflow: hidden;
      }

      /* 停止按钮内部光晕 */
      .btn-stop::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
        transition: left 0.5s ease;
      }

      .btn-stop:hover::before {
        left: 100%;
      }

      /* 停止按钮悬停效果 */
      .btn-stop:hover {
        background: linear-gradient(135deg, rgba(255, 107, 107, 0.18) 0%, rgba(239, 68, 68, 0.22) 100%);
        border-color: rgba(255, 107, 107, 0.4);
        color: #ff8787;
        transform: translateY(-2px);
        box-shadow: 0 0 30px rgba(255, 107, 107, 0.25),
                    0 4px 20px rgba(255, 107, 107, 0.15),
                    inset 0 1px 0 rgba(255, 255, 255, 0.15);
      }

      .btn-stop:active {
        transform: translateY(0);
        box-shadow: 0 0 15px rgba(255, 107, 107, 0.15),
                    inset 0 1px 0 rgba(255, 255, 255, 0.1);
      }

      .btn-secondary {
        background: rgba(0, 161, 214, 0.15);
        color: var(--bilibili-blue);
        border: 1px solid rgba(0, 161, 214, 0.3);
        margin-top: 10px;
        display: none;
        animation: fadeInUp 0.4s ease-out 0.4s both;
      }

      .btn-secondary.visible {
        display: block;
      }

      .btn-secondary:hover {
        background: rgba(0, 161, 214, 0.25);
        border-color: rgba(0, 161, 214, 0.5);
        transform: translateY(-2px);
        box-shadow: 0 4px 16px rgba(0, 161, 214, 0.2);
      }

      /* 提示文本 */
      .hint {
        font-size: 11px;
        color: var(--text-muted);
        line-height: 1.6;
        padding: 12px;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 8px;
        border-left: 2px solid var(--bilibili-pink);
        margin-top: 16px;
        animation: fadeInUp 0.4s ease-out 0.5s both;
      }

      .hint strong {
        color: var(--text-secondary);
        font-weight: 600;
      }

      /* 分隔线 */
      .divider {
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
        margin: 16px 0;
      }

      /* Tab 导航 */
      .tab-bar {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
        background: var(--glass);
        border: 1px solid var(--glass-border);
        border-radius: 12px;
        padding: 4px;
        animation: fadeInUp 0.4s ease-out 0.1s both;
      }

      .tab-btn {
        flex: 1;
        background: transparent;
        border: none;
        border-radius: 9px;
        padding: 8px 12px;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-muted);
        cursor: pointer;
        transition: all 0.25s ease;
        letter-spacing: 0.3px;
      }

      .tab-btn:hover {
        color: var(--text-secondary);
        background: rgba(255, 255, 255, 0.05);
      }

      .tab-btn.active {
        background: linear-gradient(135deg, rgba(251, 114, 153, 0.2) 0%, rgba(0, 161, 214, 0.15) 100%);
        color: var(--text-primary);
        border: 1px solid rgba(251, 114, 153, 0.25);
      }

      /* Tab 内容 */
      .tab-content {
        display: none;
      }

      .tab-content.active {
        display: block;
      }

      /* 已下载列表 */
      .library-empty {
        text-align: center;
        color: var(--text-muted);
        font-size: 13px;
        padding: 32px 0;
      }

      .library-item {
        background: var(--glass);
        border: 1px solid var(--glass-border);
        border-radius: 12px;
        padding: 12px 14px;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 10px;
        transition: all 0.2s ease;
      }

      .library-item:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.15);
      }

      .library-item-info {
        flex: 1;
        min-width: 0;
      }

      .library-item-bvid {
        font-size: 13px;
        font-weight: 600;
        color: var(--bilibili-pink);
        font-family: ui-monospace, "SF Mono", "Cascadia Code", monospace;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .library-item-meta {
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 2px;
      }

      .library-item-actions {
        display: flex;
        gap: 6px;
        flex-shrink: 0;
      }

      .lib-btn {
        border: none;
        border-radius: 8px;
        padding: 5px 10px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        letter-spacing: 0.2px;
      }

      .lib-btn-view {
        background: rgba(0, 161, 214, 0.15);
        color: var(--bilibili-blue);
        border: 1px solid rgba(0, 161, 214, 0.3);
      }

      .lib-btn-view:hover {
        background: rgba(0, 161, 214, 0.25);
        border-color: rgba(0, 161, 214, 0.5);
      }

      .lib-btn-del {
        background: rgba(255, 77, 79, 0.1);
        color: var(--error);
        border: 1px solid rgba(255, 77, 79, 0.25);
      }

      .lib-btn-del:hover {
        background: rgba(255, 77, 79, 0.2);
        border-color: rgba(255, 77, 79, 0.45);
      }

      /* 进行中条目 */
      @keyframes borderPulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(251,114,153,0); border-color: rgba(251,114,153,0.35); }
        50%       { box-shadow: 0 0 12px 2px rgba(251,114,153,0.15); border-color: rgba(251,114,153,0.6); }
      }
      @keyframes progressShimmer {
        0%   { background-position: -200% center; }
        100% { background-position: 200% center; }
      }
      @keyframes dotPulse {
        0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
        40%           { opacity: 1;   transform: scale(1); }
      }
      .library-item-active {
        background: linear-gradient(135deg, rgba(251,114,153,0.06) 0%, rgba(0,161,214,0.04) 100%);
        border: 1px solid rgba(251,114,153,0.35);
        border-radius: 12px;
        padding: 12px 14px 0;
        margin-bottom: 10px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        animation: borderPulse 2.4s ease-in-out infinite;
      }
      .library-item-active-body {
        display: flex;
        align-items: center;
        gap: 10px;
        padding-bottom: 10px;
      }
      .library-item-progress-text {
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 3px;
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .dot-loader span {
        display: inline-block;
        width: 3px; height: 3px;
        border-radius: 50%;
        background: var(--bilibili-pink);
        animation: dotPulse 1.2s ease-in-out infinite;
      }
      .dot-loader span:nth-child(2) { animation-delay: 0.2s; }
      .dot-loader span:nth-child(3) { animation-delay: 0.4s; }
      .library-item-pct {
        font-size: 18px;
        font-weight: 700;
        font-family: ui-monospace, "SF Mono", "Cascadia Code", monospace;
        color: var(--bilibili-pink);
        flex-shrink: 0;
        min-width: 44px;
        text-align: right;
        letter-spacing: -0.5px;
      }
      .progress-track {
        height: 4px;
        background: rgba(255,255,255,0.06);
        overflow: hidden;
        margin: 0 -14px;
      }
      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--bilibili-pink) 0%, var(--bilibili-blue) 50%, var(--bilibili-pink) 100%);
        background-size: 200% 100%;
        border-radius: 0 2px 2px 0;
        transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        animation: progressShimmer 2s linear infinite;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- 标题区域 -->
      <div class="header" style="position: relative;">
        <button class="icon-btn" id="clearCacheBtn" style="display: none;" title="清除缓存">🧹</button>
        <div class="title">Bilibili 评论导出</div>
        <div class="subtitle">Comment Exporter</div>
      </div>

      <!-- Tab 导航 -->
      <div class="tab-bar">
        <button class="tab-btn active" id="tabExport">导出</button>
        <button class="tab-btn" id="tabLibrary">下载管理</button>
      </div>

      <!-- 导出 Tab 内容 -->
      <div class="tab-content active" id="contentExport">
        <!-- 视频信息卡片 -->
        <div class="card">
          <div class="info-row">
            <div class="info-label">当前视频</div>
            <div class="info-value bvid" id="bvid">未检测到</div>
          </div>

          <div class="info-row">
            <div class="info-label">状态</div>
            <div class="status-text" id="status">打开 B 站视频页（URL 含 /video/BV...）后再导出。</div>
          </div>
        </div>

        <!-- 缓存提示 -->
        <div class="cache-notice" id="cacheNotice">
          <div class="cache-icon">💾</div>
          <div class="cache-content">
            <div class="cache-title">已有缓存数据</div>
            <div class="cache-info" id="cacheInfo">--</div>
          </div>
        </div>

        <!-- 操作按钮 -->
        <button class="btn btn-primary" id="exportBtn" disabled>一键导出</button>
        <button class="btn btn-stop" id="stopBtn" style="display: none;">停止导出</button>
        <button class="btn btn-secondary" id="viewResultsBtn">查看已缓存结果</button>

        <!-- 说明提示 -->
        <div class="hint">
          <strong>导出内容：</strong>评论内容 / 用户名 / 楼中楼层级 / 发布时间 / IP 属地<br>
          <strong>导出完成后：</strong>将打开新标签页，提供下载和 AI 总结选项
        </div>
      </div>

      <!-- 已下载 Tab 内容 -->
      <div class="tab-content" id="contentLibrary">
        <div id="libraryList">
          <div class="library-empty">暂无下载记录</div>
        </div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
