<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Bilibili 评论导出</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bilibili-pink: #FB7299;
        --bilibili-pink-dark: #E95C84;
        --bilibili-blue: #00A1D6;
        --bg-dark: #0F0F1E;
        --bg-gradient: linear-gradient(135deg, #0F0F1E 0%, #1A1A2E 50%, #16213E 100%);
        --glass: rgba(255, 255, 255, 0.05);
        --glass-border: rgba(255, 255, 255, 0.1);
        --text-primary: #FFFFFF;
        --text-secondary: rgba(255, 255, 255, 0.7);
        --text-muted: rgba(255, 255, 255, 0.5);
        --success: #52C41A;
        --error: #FF4D4F;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes shimmer {
        0% { background-position: -100% 0; }
        100% { background-position: 200% 0; }
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }

      body {
        width: 360px;
        background: var(--bg-gradient);
        color: var(--text-primary);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
                     "Microsoft YaHei", "Source Han Sans SC", "Noto Sans CJK SC", sans-serif;
        font-size: 14px;
        line-height: 1.6;
        padding: 20px 24px 24px;
        position: relative;
        overflow-x: hidden;
      }

      /* 背景装饰 */
      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 30% 20%, rgba(251, 114, 153, 0.08) 0%, transparent 50%),
                    radial-gradient(circle at 70% 80%, rgba(0, 161, 214, 0.06) 0%, transparent 50%);
        pointer-events: none;
        animation: pulse 8s ease-in-out infinite;
      }

      .container {
        position: relative;
        z-index: 1;
        animation: fadeInUp 0.5s ease-out;
      }

      /* 标题区域 */
      .header {
        text-align: center;
        margin-bottom: 20px;
      }

      .title {
        font-family: 'Noto Serif SC', serif;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 1px;
        background: linear-gradient(135deg, var(--bilibili-pink) 0%, var(--bilibili-blue) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 6px;
      }

      .subtitle {
        font-size: 12px;
        color: var(--text-muted);
        letter-spacing: 0.5px;
      }

      /* 玻璃态卡片 */
      .card {
        background: var(--glass);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        border-radius: 16px;
        padding: 18px;
        margin-bottom: 16px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        transition: all 0.3s ease;
      }

      .card:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.15);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
      }

      /* 信息行 */
      .info-row {
        display: flex;
        align-items: center;
        margin-bottom: 12px;
        padding-bottom: 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

      .info-row:last-child {
        margin-bottom: 0;
        padding-bottom: 0;
        border-bottom: none;
      }

      .info-label {
        font-size: 12px;
        color: var(--text-muted);
        min-width: 70px;
        font-weight: 500;
        letter-spacing: 0.3px;
      }

      .info-value {
        flex: 1;
        font-size: 13px;
        color: var(--text-secondary);
        font-family: ui-monospace, "SF Mono", "Cascadia Code", "Source Code Pro", Menlo, Consolas, monospace;
        word-break: break-all;
      }

      .info-value.bvid {
        color: var(--bilibili-pink);
        font-weight: 600;
      }

      /* 状态显示 */
      .status-text {
        font-size: 13px;
        line-height: 1.5;
        color: var(--text-secondary);
        white-space: pre-wrap;
      }

      .status-text.ok {
        color: var(--success);
      }

      .status-text.err {
        color: var(--error);
      }

      /* 缓存提示 */
      .cache-notice {
        display: none;
        align-items: center;
        gap: 12px;
        padding: 14px;
        background: linear-gradient(135deg, rgba(251, 114, 153, 0.1) 0%, rgba(0, 161, 214, 0.08) 100%);
        border: 1px solid rgba(251, 114, 153, 0.25);
        border-radius: 12px;
        margin-bottom: 16px;
        animation: fadeInUp 0.4s ease-out 0.2s both;
      }

      .cache-notice.visible {
        display: flex;
      }

      .cache-icon {
        font-size: 28px;
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
      }

      .cache-content {
        flex: 1;
      }

      .cache-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--bilibili-pink);
        margin-bottom: 4px;
        letter-spacing: 0.3px;
      }

      .cache-info {
        font-size: 12px;
        color: var(--text-secondary);
        line-height: 1.4;
      }

      /* 按钮样式 */
      .btn {
        width: 100%;
        border: none;
        border-radius: 12px;
        padding: 12px 18px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
        letter-spacing: 0.5px;
        animation: fadeInUp 0.4s ease-out 0.3s both;
      }

      .btn::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        transition: left 0.5s ease;
      }

      .btn:hover::before {
        left: 100%;
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--bilibili-pink) 0%, var(--bilibili-pink-dark) 100%);
        color: white;
        box-shadow: 0 4px 16px rgba(251, 114, 153, 0.3);
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 24px rgba(251, 114, 153, 0.4);
      }

      .btn-primary:active {
        transform: translateY(0);
      }

      .btn-primary:disabled {
        background: rgba(255, 255, 255, 0.1);
        color: var(--text-muted);
        cursor: not-allowed;
        box-shadow: none;
      }

      .btn-primary:disabled:hover {
        transform: none;
      }

      .btn-secondary {
        background: rgba(0, 161, 214, 0.15);
        color: var(--bilibili-blue);
        border: 1px solid rgba(0, 161, 214, 0.3);
        margin-top: 10px;
        display: none;
        animation: fadeInUp 0.4s ease-out 0.4s both;
      }

      .btn-secondary.visible {
        display: block;
      }

      .btn-secondary:hover {
        background: rgba(0, 161, 214, 0.25);
        border-color: rgba(0, 161, 214, 0.5);
        transform: translateY(-2px);
        box-shadow: 0 4px 16px rgba(0, 161, 214, 0.2);
      }

      /* 提示文本 */
      .hint {
        font-size: 11px;
        color: var(--text-muted);
        line-height: 1.6;
        padding: 12px;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 8px;
        border-left: 2px solid var(--bilibili-pink);
        margin-top: 16px;
        animation: fadeInUp 0.4s ease-out 0.5s both;
      }

      .hint strong {
        color: var(--text-secondary);
        font-weight: 600;
      }

      /* 分隔线 */
      .divider {
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
        margin: 16px 0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- 标题区域 -->
      <div class="header">
        <div class="title">Bilibili 评论导出</div>
        <div class="subtitle">Comment Exporter</div>
      </div>

      <!-- 视频信息卡片 -->
      <div class="card">
        <div class="info-row">
          <div class="info-label">当前视频</div>
          <div class="info-value bvid" id="bvid">未检测到</div>
        </div>

        <div class="info-row">
          <div class="info-label">状态</div>
          <div class="status-text" id="status">打开 B 站视频页（URL 含 /video/BV...）后再导出。</div>
        </div>
      </div>

      <!-- 缓存提示 -->
      <div class="cache-notice" id="cacheNotice">
        <div class="cache-icon">💾</div>
        <div class="cache-content">
          <div class="cache-title">已有缓存数据</div>
          <div class="cache-info" id="cacheInfo">--</div>
        </div>
      </div>

      <!-- 操作按钮 -->
      <button class="btn btn-primary" id="exportBtn" disabled>一键导出</button>
      <button class="btn btn-secondary" id="viewResultsBtn">查看已缓存结果</button>

      <!-- 说明提示 -->
      <div class="hint">
        <strong>导出内容：</strong>评论内容 / 用户名 / 楼中楼层级 / 发布时间 / IP 属地<br>
        <strong>导出完成后：</strong>将打开新标签页，提供下载和 AI 总结选项
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
